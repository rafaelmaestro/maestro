<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#21222c">
<title>Maestro</title>
<style>
:root{
  --win:#282a36; --panel:#21222c; --raise:#313342; --line:#3b3d50; --fg:#f8f8f2; --muted:#9a9dbb; --comment:#6272a4;
  --accent:#bd93f9; --ok:#50fa7b; --cyan:#8be9fd; --orange:#ffb86c; --bad:#ff5555;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--win);color:var(--fg);font:15px/1.45 var(--sans);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.top b{font-weight:600}
.top .sp{flex:1}
.top .meta{color:var(--muted);font-size:12px}
.back{font-size:22px;line-height:1;color:var(--accent);padding:0 6px 0 0}
.body{flex:1;overflow:auto;min-height:0}
.sec{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .g{font-family:var(--mono);grid-row:span 2}
.row .b{font-family:var(--mono);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{grid-column:2;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{color:var(--comment);font-size:12px}
.row.att{background:rgba(255,184,108,.08)}
.g.blocked{color:var(--orange)} .g.working{color:var(--cyan)} .g.done{color:var(--ok)} .g.idle,.g.unknown{color:var(--comment)}
.pane{font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;margin:0}
.pane .out{color:var(--comment)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.keys button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:10px 0;font-size:13px;display:grid;justify-items:center}
.keys button small{color:var(--muted);font-size:11px}
.ok{color:var(--ok);font-size:12px;padding:0 12px 4px;background:var(--panel)}
.ok.err{color:var(--bad)}
.in{display:flex;gap:8px;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.in textarea{flex:1;min-height:42px;max-height:120px;resize:none;background:var(--win);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:15px var(--sans);padding:10px}
.btn{padding:0 14px;border-radius:8px;background:var(--accent);color:#282a36;font-weight:500}
.empty{padding:48px 24px;display:grid;gap:12px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);font-size:17px}
.mono{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<header class="top" id="top"><b>Maestro</b></header>
<main class="body" id="body"></main>
<footer id="foot"></footer>
<script>
const ST={blocked:['!','precisa de você'],working:['◐','trabalhando'],done:['✓','pronto pra revisar'],idle:['○','parado'],unknown:['·','—']};
const ORDER={blocked:0,done:1,working:2,idle:3,unknown:4};
const KEYS=[['1','Sim','1'],['2','Sempre','2'],['3','Não','3'],['⏎','Enter','enter'],['Esc','','esc']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='list', pane=null, agents=[], timer=null, note='', noteErr=false, nosession=false;

async function api(path,body){
  const opt={headers:{'ngrok-skip-browser-warning':'1'},credentials:'same-origin'};
  if(body!==undefined){ opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r=await fetch(path,opt);
  if(r.status===401){ nosession=true; render(); throw new Error('401'); }
  if(!r.ok) throw new Error(await r.text()||('HTTP '+r.status));
  return r.json();
}

function st(s){ return ST[s]||ST.unknown; }
function row(a){ const [g,l]=st(a.status);
  return `<button class="row ${a.status==='blocked'?'att':''}" data-p="${esc(a.pane)}"><span class="g ${esc(a.status)}">${g}</span><span class="b">${esc(a.label)}</span><span class="a">${esc(a.repo)}</span><span class="m">${l}${a.title?' · '+esc(a.title):''}</span></button>`; }

function render(){
  if(nosession){
    $('#top').innerHTML='<b>Maestro</b>'; $('#foot').innerHTML='';
    $('#body').innerHTML='<div class="empty"><b>Leia o QR no Maestro</b><span>Este celular não está pareado, ou o acesso foi desligado ou pareado em outro aparelho.</span><span class="mono">Paleta → Celular: ligar acesso remoto</span></div>';
    return; }
  if(view==='list'){
    const att=agents.filter(a=>a.status==='blocked'), rest=agents.filter(a=>a.status!=='blocked').sort((a,b)=>(ORDER[a.status]??4)-(ORDER[b.status]??4));
    const work=agents.filter(a=>a.status==='working').length;
    $('#top').innerHTML=`<b>Maestro</b><span class="sp"></span><span class="meta">${att.length?`<span style="color:var(--orange)">! ${att.length}</span> · `:''}${work} trabalhando</span>`;
    $('#body').innerHTML=agents.length?(att.length?`<div class="sec">Precisa de você</div>${att.map(row).join('')}`:'')+(rest.length?`<div class="sec">Features</div>${rest.map(row).join('')}`:''):'<div class="empty"><span>Nenhum Claude rodando.</span></div>';
    $('#foot').innerHTML='';
    document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ pane=b.dataset.p; view='feat'; note=''; render(); poll(); });
    return; }
  const a=agents.find(x=>x.pane===pane)||{label:pane,status:'unknown'}; const [g,l]=st(a.status);
  $('#top').innerHTML=`<button class="back" id="back" aria-label="Voltar">‹</button><span style="min-width:0"><b class="mono" style="font-size:14px">${esc(a.label)}</b><br><span class="g ${esc(a.status)}" style="font-size:12px">${g} ${l}</span></span>`;
  $('#back').onclick=()=>{ view='list'; pane=null; render(); poll(); };
  if(!$('#pane')) $('#body').innerHTML='<pre class="pane" id="pane"></pre>';
  if(!$('#keys')){
    $('#foot').innerHTML=`<div class="keys" id="keys">${KEYS.map(([k,l,v])=>`<button data-k="${v}">${k}${l?`<small>${l}</small>`:''}</button>`).join('')}</div><div class="ok" id="note"></div><div class="in"><textarea id="txt" placeholder="Prompt para o Claude desta feature…" aria-label="Prompt"></textarea><button class="btn" id="send">Enviar</button></div>`;
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>act('keys',{key:b.dataset.k}));
    $('#send').onclick=()=>{ const t=$('#txt').value.trim(); if(t) act('prompt',{text:t}).then(ok=>{ if(ok) $('#txt').value=''; }); };
  }
  const n=$('#note'); n.textContent=note; n.className='ok'+(noteErr?' err':'');
}

async function act(what,body){
  try{ await api(`/api/agents/${encodeURIComponent(pane)}/${what}`,body); note=what==='prompt'?'enviado':''; noteErr=false; render(); poll(); return true; }
  catch(e){ if(e.message!=='401'){ note=e.message; noteErr=true; render(); } return false; }
}

async function poll(){
  clearTimeout(timer); if(nosession||document.hidden) return;
  try{
    agents=(await api('/api/agents')).agents;
    if(view==='feat'){
      const r=await api(`/api/agents/${encodeURIComponent(pane)}/screen`).catch(e=>{ if(e.message==='401') throw e; return {text:e.message}; });
      const body=$('#body'), atEnd=body.scrollHeight-body.scrollTop-body.clientHeight<40;
      render();
      $('#pane').innerHTML=esc(r.text||'').split('\n').map(l=>/^\s*⎿/.test(l)?`<span class="out">${l}</span>`:l).join('\n');
      if(atEnd) body.scrollTop=body.scrollHeight;
    } else render();
  }catch(e){ if(e.message==='401') return; }
  timer=setTimeout(poll,view==='feat'?1500:2000);
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });

(async()=>{
  const m=location.hash.match(/t=([0-9a-f]+)/);
  if(m){ history.replaceState(null,'',location.pathname);
    try{ await api('/api/pair',{token:m[1]}); }catch(e){} }
  nosession=false; poll();
})();
</script>
</body>
</html>
